# Blueprint de Render: un solo servicio web (backend FastAPI, que ademas sirve
# el build del frontend, ver backend/app/main.py) + una base Postgres.
#
# Uso: en el dashboard de Render, "New +" -> "Blueprint", conecta este
# repositorio. Render lee este archivo y crea todo lo de abajo de una vez.
#
# Variables marcadas con `sync: false` son secretas y NO viven en este archivo
# ni en el repositorio: Render las pide una por una al crear el blueprint, y
# tambien se pueden pegar/editar despues en el dashboard del servicio
# ("Environment"). Ver DEPLOY.md para el detalle de cada una.

databases:
  - name: agrotrace-db
    plan: free
    databaseName: agrotrace
    user: agrotrace

services:
  - type: web
    name: agrotrace
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      cd frontend && npm install && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # --- Generadas o resueltas por Render, sin que tengas que hacer nada ---
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: AGROTRACE_DATABASE_URL
        fromDatabase:
          name: agrotrace-db
          property: connectionString
      - key: AGROTRACE_SECRET_KEY
        generateValue: true

      # --- Fijas para este despliegue (cambialas aqui si usas un dominio propio) ---
      # OJO: si al crear el servicio Render te asigna otro nombre de subdominio
      # (por ejemplo si "agrotrace" ya esta tomado), edita estas dos para que
      # coincidan con la URL real ANTES del primer despliegue exitoso.
      - key: AGROTRACE_PUBLIC_WEB_URL
        value: https://agrotrace.onrender.com
      - key: AGROTRACE_CORS_ORIGINS
        value: https://agrotrace.onrender.com
      # Una cuenta demo publica no tiene sentido conviviendo con usuarios
      # reales: en produccion se siembra apagada.
      - key: AGROTRACE_SEED_DEMO
        value: "false"

      # --- Secretas: Render las pide al crear el blueprint (ver DEPLOY.md) ---
      - key: GEMINI_API_KEY
        sync: false
      - key: AGROTRACE_SMTP_HOST
        sync: false
      - key: AGROTRACE_SMTP_PORT
        value: "587"
      - key: AGROTRACE_SMTP_USER
        sync: false
      - key: AGROTRACE_SMTP_PASSWORD
        sync: false
      - key: AGROTRACE_SMTP_FROM
        sync: false
      - key: AGROTRACE_S3_ENDPOINT_URL
        sync: false
      - key: AGROTRACE_S3_ACCESS_KEY_ID
        sync: false
      - key: AGROTRACE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: AGROTRACE_S3_BUCKET
        sync: false
      - key: AGROTRACE_S3_REGION
        value: auto
      - key: AGROTRACE_S3_PUBLIC_BASE_URL
        sync: false
